name: Check Dependencies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Check for outdated dependencies
        run: |
          python .github/scripts/check_dependencies.py || echo "Warning: Check dependencies script had issues, continuing..."

      - name: Check for snippets that need updating
        run: |
          python .github/scripts/check_snippets.py ./outdated_dependencies.json . || echo "Warning: Snippet check script had issues, continuing..."

      - name: Create GitHub issues for outdated dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/create_issues.py
